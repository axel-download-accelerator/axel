name: Coverage (C)

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CFLAGS: "--coverage -O0 -g"
      LDFLAGS: "--coverage"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build gcovr lcov bear

      - name: Detect build system
        shell: bash
        run: |
          if [ -f CMakeLists.txt ]; then
            echo "BUILD_SYSTEM=cmake" >> $GITHUB_ENV
          elif [ -f Makefile ] || [ -f makefile ]; then
            echo "BUILD_SYSTEM=make" >> $GITHUB_ENV
          else
            echo "BUILD_SYSTEM=cmake" >> $GITHUB_ENV
          fi

      # ---- CMake path ----
      - name: Configure with coverage (CMake)
        if: env.BUILD_SYSTEM == 'cmake'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="$CFLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$LDFLAGS" \
            -DCMAKE_SHARED_LINKER_FLAGS="$LDFLAGS"

      - name: Build (CMake)
        if: env.BUILD_SYSTEM == 'cmake'
        run: cmake --build build --parallel

      - name: Test (CTest)
        if: env.BUILD_SYSTEM == 'cmake'
        run: ctest --test-dir build --output-on-failure

      # ---- Make path ----
      - name: Build with coverage (Make)
        if: env.BUILD_SYSTEM == 'make'
        run: |
          make clean || true
          # Use bear to capture compile_commands.json for any later tooling
          bear -- make -j CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS"

      - name: Test (Make)
        if: env.BUILD_SYSTEM == 'make'
        run: |
          set -e
          if make test 2>/dev/null; then
            echo "make test passed"
          elif [ -d tests ] && [ -x tests/run_tests.sh ]; then
            ./tests/run_tests.sh
          else
            echo "No test target or runner found"; exit 0
          fi

      - name: Generate coverage (gcovr)
        run: |
          mkdir -p coverage
          gcovr -r . --xml-pretty -o coverage/coverage.xml \
                --exclude-directories 'tests' \
                --delete
          gcovr -r . --html --html-details -o coverage/index.html \
                --exclude-directories 'tests'

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
        on:
          pull_request:
          push:
            branches: [ main, master ]

      # Optional: Codecov (add CODECOV_TOKEN for private repos)
      # - name: Upload to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     files: coverage/coverage.xml
